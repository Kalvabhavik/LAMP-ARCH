<VirtualHost *:80>
    ServerName portal.nexacore.local
    Redirect permanent / https://portal.nexacore.local/
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.nexacore.local
    DocumentRoot /var/www/nexacore/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/nexacore.crt
    SSLCertificateKeyFile /etc/ssl/private/nexacore.key

    ErrorLog ${APACHE_LOG_DIR}/nexacore_error.log
    CustomLog ${APACHE_LOG_DIR}/nexacore_access.log combined

    # Database credentials live in the environment, never in PHP source.
    SetEnv DB_HOST localhost
    SetEnv DB_NAME nexacore
    SetEnv DB_USER nexa_app
    SetEnv DB_PASS change-me-in-vault

    <Directory /var/www/nexacore/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    php_admin_flag display_errors off
    php_admin_flag log_errors on
</VirtualHost>
